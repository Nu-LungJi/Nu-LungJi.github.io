name: 한국어 맞춤법 검사

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  spellcheck:
    name: Hanspell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: py-hanspell 설치
        run: |
          pip install py-hanspell

      - name: 변경된 Markdown 검사
        id: spellcheck
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only \
            "$BASE_SHA" "$HEAD_SHA" \
            --diff-filter=AMR \
            -- '*.md' '*.markdown' \
            > files.txt

          if [ ! -s files.txt ]; then
            echo "Markdown 변경 없음"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/hanspell_check.py $(cat files.txt)


      - name: PR 댓글 작성
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_FILE: /tmp/hanspell-result.txt
          STATUS: ${{ steps.spellcheck.outputs.failed }}
        with:
          script: |
            const fs = require("fs");

            let result = "";

            if (fs.existsSync(process.env.RESULT_FILE)) {
              result = fs.readFileSync(process.env.RESULT_FILE, "utf8");
            }

            let body;

            if (process.env.STATUS === "true") {
              body =
              `## ⚠️ 한국어 맞춤법 검사 실패\n\n` +
              "수정이 필요한 맞춤법 오류가 발견되었습니다.\n\n" +
              "```\n" +
              result.slice(0, 6000) +
              "\n```";
            } else {
              body =
              `## ✅ 한국어 맞춤법 검사 통과\n\n` +
              "변경된 Markdown 파일 검사가 완료되었습니다.\n\n" +
              result.slice(0, 6000);
            }


            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
