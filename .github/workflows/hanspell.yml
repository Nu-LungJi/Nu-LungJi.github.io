name: 한국어 맞춤법 검사

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  
jobs:
  spellcheck:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: hanspell 설치
        run: npm install --global hanspell --ignore-scripts

      - name: 변경된 Markdown 검사
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$marker"

          failed=0
          count=0

          # 변경 파일 조회가 실패하면 검사를 중단
          git diff --name-only -z --diff-filter=AMR \
            "$BASE_SHA...$HEAD_SHA" -- '*.md' '*.markdown' \
            > "$RUNNER_TEMP/hanspell-files"

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            printf '\n📝 검사 파일: %s\n' "$file"

            if ! timeout 90s hanspell-cli < "$file"; then
              printf '⚠️ 검사 실행 실패 또는 시간 초과\n'
              failed=1
            fi
          done < "$RUNNER_TEMP/hanspell-files"

          printf '\n검사 대상: %s개 파일\n' "$count"
          echo "::$marker::"
          exit "$failed"
