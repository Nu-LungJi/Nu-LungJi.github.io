# Blog Information
title: LungJi Lab
email: shinhwa30724@gmail.com
description: "똥글 싸지릅니다."
github_username: LungJi
search: true

# Blog Theme
remote_theme: mmistakes/minimal-mistakes@4.28.0
minimal_mistakes_skin: "default" # "air"

# MarkDown
markdown: kramdown
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages
  
# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author
author:
  name   : "LungJi"
  avatar : "/assets/images/bio-photo.jpg"
  # bio    : "Unreal Game Programmer"
  # location : "Seoul, Korea"
  
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Nu-LungJi"

# Footer (Blog Bottom Section Layout)
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Nu-LungJi"

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "sidebar-category"
        
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
